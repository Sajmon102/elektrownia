<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz – prowadzący</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f7fb;font:16px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#1d2a3d;border:1px solid #34445c;border-radius:18px;padding:22px;margin:14px 0}h1{font-size:clamp(28px,5vw,44px)}button{border:0;border-radius:12px;padding:14px 20px;font-weight:bold;font-size:16px;cursor:pointer;background:#34d399;color:#08251b;margin:6px}button.secondary{background:#334155;color:white}button:disabled{opacity:.4;cursor:not-allowed}.muted{color:#b8c5d6}.big{font-size:30px;font-weight:bold}.qr{width:240px;background:white;padding:10px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{padding:20px;border-radius:14px;background:#334155;font-size:20px}.barrow{display:grid;grid-template-columns:30px 1fr 45px;gap:10px;align-items:center;margin:12px 0}.bar{height:25px;background:#334155;border-radius:8px;overflow:hidden}.fill{height:100%;background:#34d399}.podium{display:flex;justify-content:center;align-items:end;gap:8px;margin:25px 0}.pod{width:30%;text-align:center;padding:14px 5px;border-radius:12px 12px 0 0;background:#334155}.gold{height:150px;background:#b88a22}.silver{height:115px;background:#718096}.bronze{height:90px;background:#9a603c}.hidden{display:none}.players{display:flex;flex-wrap:wrap;gap:8px}.player{background:#334155;padding:9px 13px;border-radius:20px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #40516a}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><main class="wrap">
<div class="top"><div><h1>⚛️ Quiz: Elektrownia jądrowa</h1><p class="muted">Panel prowadzącego</p></div><div class="card">Uczestnicy: <b id="count">0</b></div></div>
<section id="lobby" class="card"><h2>Pokój quizowy</h2><button id="create">Utwórz quiz i pokaż QR</button><div id="roomInfo" class="hidden"><p>Kod pokoju: <span class="big" id="code"></span></p><img id="qr" class="qr"><p><a id="joinLink" target="_blank" style="color:#6ee7b7"></a></p><h3>Uczniowie w pokoju</h3><div id="players" class="players"></div><button id="start">START</button></div><p id="msg" class="muted"></p></section>
<section id="game" class="card hidden"><p class="muted" id="progress"></p><h2 id="question"></h2><div id="choices" class="grid"></div><p id="answerProgress" class="muted"></p><button class="secondary" id="close">Koniec pytania</button><div id="reaction" class="big"></div></section>
<section id="results" class="card hidden"><h2>Wyniki pytania</h2><p id="correct"></p><div id="bars"></div><h3>Ranking</h3><div id="topTable"></div><div id="restTable"></div><button id="next">Dalej</button></section>
<section id="finished" class="card hidden"><h2>🏆 Koniec quizu!</h2><div id="podium"></div><div id="allRanks"></div></section>
</main><script src="/socket.io/socket.io.js"></script><script src="/common.js"></script><script src="/host.js"></script></body></html>
